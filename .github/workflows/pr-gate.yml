name: Submission gate

# Checks the repos behind a PR's entries: dsh.bundle manifest, repo age and
# commit count. All three need the authenticated GitHub API, which the
# fork-safe `pull_request` job in pr-check.yml deliberately has no access to —
# so this runs via workflow_run, in the base repository's context, after that
# job finishes. `pull_request_target` would also get a token but would run
# fork-supplied code with write permissions, which is not worth it for a check.

on:
  workflow_run:
    workflows: ['PR check']
    types: [completed]

permissions:
  contents: read
  checks: write

concurrency:
  group: pr-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Resolve the pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const sha = context.payload.workflow_run.head_sha
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 })
            const pr = prs.find((p) => p.head.sha === sha)
            if (!pr) {
              core.info(`no open PR matches ${sha} — nothing to gate`)
              core.setOutput('found', 'false')
              return
            }
            core.setOutput('found', 'true')
            core.setOutput('number', String(pr.number))
            core.setOutput('base_sha', pr.base.sha)
            core.setOutput('created_at', pr.created_at)

      - uses: actions/checkout@v4
        if: steps.pr.outputs.found == 'true'
        with:
          # The PR merge ref, so the entry files under test are the PR's.
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.found == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.pr.outputs.found == 'true'

      - name: Check submitted entries
        if: steps.pr.outputs.found == 'true'
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-submission.mjs \
            --base "${{ steps.pr.outputs.base_sha }}" \
            --pr-created "${{ steps.pr.outputs.created_at }}" \
            --json gate-result.json

      - name: Report result on the PR
        if: steps.pr.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            let result = { ok: true, failures: [] }
            try { result = JSON.parse(fs.readFileSync('gate-result.json', 'utf8')) } catch {}

            const lines = result.failures.flatMap((f) => [`**${f.url}**`, ...f.problems.map((p) => `- ${p}`), ''])
            const summary = result.ok
              ? 'All submitted entries pass: `dsh.bundle` declared, repo old enough, enough commits.'
              : lines.join('\n')

            await github.rest.checks.create({
              owner, repo,
              name: 'Submission gate',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'completed',
              conclusion: result.ok ? 'success' : 'failure',
              output: {
                title: result.ok ? 'Entries look good' : `${result.failures.length} entry/entries need changes`,
                summary: summary.slice(0, 65000),
                text: result.ok ? undefined : 'See contributing.md for the bundle manifest example and the full rules.',
              },
            })
            if (!result.ok) core.setFailed(`${result.failures.length} entry/entries did not pass`)
