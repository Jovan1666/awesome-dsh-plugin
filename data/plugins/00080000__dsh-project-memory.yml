description:
  zh: "dsh 项目级持久记忆。**读到即索引**：模型读文件时才建索引，未读零开销。文档自动摘要，代码零依赖出符号表，每条可回源验证。分片存储 + 无锁同步事务，LLM 摘要从不阻塞查询/记忆。纯 JS、单依赖懒加载，无数据库/向量库/后台服务。5000 文件冷启动 64ms，查询中位数 2.6ms，索引体积约 0.3KB/条目。"
  en: "Project memory for dsh with read-time indexing: only files the model reads get indexed, unread files cost nothing. Docs get LLM summaries; code yields zero-token symbol tables via regex. Every entry has a path:line citation back to source. Sharded storage + lock-free transactions; background indexing never blocks queries or memory ops. Pure JS with a single lazy-loaded dep—no DB, vector store, or daemon. 5000 files load in 64ms; median query latency 2.6ms; index size ~0.3 KB/entry."
