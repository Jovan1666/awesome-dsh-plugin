description:
  zh: "为 DeepSeek Harness 提供持久化的项目级记忆。专门针对项目开发，原生融合 dsh 任务系统：会话内任务清单与读写文件自动沉淀为跨会话可续接的任务记录，任务↔文件自动关联——开发工作流可切换、可续接，无需重复梳理。读文件即记忆（无需全量预扫），提取代码符号、生成文档摘要并文档↔符号交叉链接；可选 TS 语义增强（装 TS 自动激活）。经验笔记自动去重。所有数据召回附带出处可溯源。纯 JS、单依赖、开箱即用、静默运行，零操作成本。"
  en: "Project memory for dsh with native task-system integration: session todos and file reads auto-condense into cross-session task records (task↔file links), so workflows are switchable and resumable without re-contextualizing. Read-time memory (no upfront scan): extracts code symbols, summarizes docs, and cross-links docs↔symbols; optional TS semantic enhancement (auto on when TS installed). Experience notes auto-dedup. Every recall includes a traceable citation. Pure JS, single dep, works out of the box, silent operation, zero overhead."