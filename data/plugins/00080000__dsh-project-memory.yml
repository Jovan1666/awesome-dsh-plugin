description:
  zh: "dsh 项目级持久记忆。**读到即索引**：模型读文件时才索引，未读零开销。文档（PDF/MD/txt）LLM 摘要，代码（7 语言）零依赖正则出符号表。每条带 `path:line` 可回源。分片存储 + 无锁同步事务，watch 计算提交分离，LLM 摘要不阻塞查询/记忆。BM25 三层检索，CJK 短语加分 + 同义词 + 精确链接边界。纯 JS，单依赖 pdfjs 懒加载，无数据库/向量库/后台服务。"
  en: "Project-level persistent memory for dsh with **read-time indexing**: files indexed only when model reads them. Docs (PDF/MD/txt) → LLM summaries; code (7 langs) → zero-token symbol tables via regex. Every entry has `path:line` for verification. Sharded storage + lock-free sync transactions; watch separates compute from commit. BM25 over docs/symbols/experience with CJK phrase boost (×1.5), synonyms, precise link boundaries. Pure JS, single dep (pdfjs lazy-loaded), no DB/vector service/daemon."
