description:
  zh: "dsh 项目级持久记忆。**读到即索引**：模型读取文件时自动索引，未读文件零开销。文档（PDF/MD/txt）经 LLM 摘要，代码（7 语言）零依赖正则提取符号表。每条携带 `path:line` 引用可回源验证。分片存储 + 无锁同步事务，watch 计算与提交分离，LLM 摘要不阻塞 remember/forget。BM25 检索文档/符号/经验三层，CJK 短语加分 + 同义词 + 精确链接边界。纯 JS、单依赖（pdfjs 懒加载），无数据库/向量库/后台服务。"
  en: "Project-level persistent memory for dsh with **read-time indexing**: files are indexed only when the model reads them; unread files incur zero cost. Documents (PDF/MD/txt) → LLM summaries; code (7 langs) → zero-token symbol tables via dependency-free regex. Every entry carries `path:line` for source verification. Sharded storage + lock-free sync transactions; watch separates compute from commit so LLM work never blocks remember/forget. BM25 over docs/symbols/experience with CJK phrase boost (×1.5), synonyms, and precise link boundaries. Pure JS, single dep (pdfjs lazy-loaded), no DB/vector service/daemon."
