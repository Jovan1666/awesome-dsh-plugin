url: https://github.com/shengyvself/narrative-prompt-polish
name: shengyvself/narrative-prompt-polish
category: workflow
description:
  en: >-
    One-click prompt polisher for DSH composer drafts: a ✨ button next to the message box turns your rough draft into a clear, agent-ready prompt. v0.0.20+ default flow is "click ✨ → spawn a better-sidebar side-chat → agent polishes the draft in a multi-turn side conversation → you copy the final version back to the main input". Built-in capabilities: full-session replay that hits the prompt cache (C-plan, the default `full` context mode), a 3-tier fallback chain `full → partial → none` for non-live / oversized sessions, JSONL trace logging per call (intent / contextMode / fallbacks / cache hit / token counts / hash fingerprints), and a sidebar event-bus bridge (`narrative:prompt-polish:trigger` / `:result`) that hooks side-chat input boxes without modifying better-sidebar's React tree. A trust fence wraps all API routes (Host loopback / trustedHosts / sec-fetch-site / Origin), CAS write-back refuses to overwrite a draft that has changed since the request was issued, and errors are split into stable codes (rejected{empty,references,too-large} / no-session / route-unavailable / stream-failed / empty-result / context-fallback / settings-unavailable). The legacy single-shot /api/polish path is kept for headless / no-sidebar setups. PREREQUISITE: requires omdsh-dev/DSH-better-sidebar (>=0.16.1) installed and enabled — the v0.0.20+ side-chat polishing flow depends on it, and the plugin will surface an explicit error (no silent fallback) if better-sidebar is missing.
  zh: >-
    DSH 主输入框右座 ✨ 一键把草稿改写成清晰、具体、可直接交给 AI Agent 执行的提示词。0.0.20+ 默认主流程是「点 ✨ → 弹出 better-sidebar 侧边对话 → Agent 在侧栏多轮打磨 → 手动回填主输入框」。内置能力：C 方案复刻完整会话前缀以命中 prompt cache（默认 `full` 上下文模式）、三档降级链 `full → partial → none` 覆盖非 live / 超大会话场景、每次调用 JSONL trace（intent / contextMode / fallbacks / cache hit / token / 草稿与 system 指纹）、侧栏事件总线联动（`narrative:prompt-polish:trigger` / `:result`，只观察 better-sidebar DOM 标记，不修改其 React 树）。API 路由统一信任围栏（Host loopback / trustedHosts / sec-fetch-site / Origin），CAS 写回在草稿已变时拒绝覆盖，错误细分为稳定业务码（rejected{empty,references,too-large} / no-session / route-unavailable / stream-failed / empty-result / context-fallback / settings-unavailable）。保留 /api/polish 单次路径供无侧栏/无头场景调用。**前置依赖**：必须先安装并启用 omdsh-dev/DSH-better-sidebar（>=0.16.1）—— 0.0.20+ 的侧栏对话打磨主流程强依赖该插件，缺失时会显式报错（不静默兑底）。
