description:
  en: "Cross-session memory with zero-token deterministic recall (bigram-Jaccard fused with FTS5 BM25 via RRF, accurate Chinese tokenization), and reinforcement that strengthens repeated observations. Crystallizes procedures into SKILL.md files that refine in place, curated through an active-stale-archived lifecycle with reversible archive and rollback. v0.5.0 makes autonomy a user-chosen dial: ingest approvalMode has three tiers (manual, balanced, autonomous) that still force conflicts and high-importance writes to human review, bounded by a per-turn auto-confirm cap and a hard pending-queue limit; disposal disposalMode has two tiers (manual, suggest) and never auto-deletes in any tier — candidates use an objective non-heat rule (never-injected and never-recalled past a cool-off, excluding pinned and protected kinds). Retrieval fixes a Chinese-tokenizer bug so paraphrase queries recall, folds tags into the FTS index, and surfaces retrieval degradation. Pending records carry the source-context snippet they were drawn from. Requires Node 22.5+."
  zh: "跨会话记忆，零 token 确定性召回（bigram-Jaccard 与 FTS5 BM25 经 RRF 融合，中文分词精确）；重复观察会强化已有理解而非堆叠重复。过程性知识结晶为 SKILL.md，就地精炼升级，走 active-stale-archived 生命周期治理，归档可逆、可回滚。v0.5.0 把自治程度做成用户可选维度：摄入 approvalMode 三档（手动、平衡、自治），自治档仍强制把冲突与高重要写入交人工复核，并受每轮自动确认上限与待确认队列硬上限约束；处置 disposalMode 两档（手动、建议），任何档都不自动删除——候选采用客观的非热度规则（从未注入且从未被召回、过冷静期，排除 pinned 与受保护类型）。检索修复中文分词 bug 让转述查询可召回、标签并入 FTS 索引、并暴露检索降级状态。待确认记忆附带其来源上下文片段。需要 Node 22.5+。"
