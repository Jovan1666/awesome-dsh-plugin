url: https://github.com/uckkk/dsh-valley-meter
name: uckkk/dsh-valley-meter
category: ui
description:
  en: "Peak-Valley Meter (峰谷电表): a low-key balance-number chip above the composer; hovering reveals a 24h peak/valley timeline (orange peak / blue valley segments, a glowing white marker at the current local time, 00/06/12/18/24 ticks). Official balance refreshed every 5s, today's spend metered independently; 10 curated muted color presets (One Dark/Dracula/Nord/Tokyo Night/Gruvbox/Solarized + traditional Chinese & Pantone) plus custom valley/peak colors, all-Chinese UI."
  zh: "峰谷电表——波谷倒计时小组件：输入框上方一枚低调的余额数字徽章，悬停浮现 24 小时峰谷时间轴（峰橙/谷蓝时段、白色发光指针标当前本地时刻、00/06/12/18/24 刻度）；官方余额 5 秒实时刷新、今日消耗独立计费；内置 10 套沉稳配色预置（One Dark/Dracula/Nord/Tokyo Night/Gruvbox/Solarized + 中国传统色/潘通）并支持谷/峰色自定义，全中文界面。"
