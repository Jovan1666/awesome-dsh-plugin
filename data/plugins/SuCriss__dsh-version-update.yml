description:
  zh: "dsh Web GUI 设置面板里的版本管理：对照 npm 各渠道/版本线比较已装的 @deepseek-ai/dsh，一键安装或降级，本地快照秒级回滚，策略引擎（静默自动更新、执行窗口、每日检查）托管整个流程。绝不在安装中途终止 npm——卡死的任务要等一小时才会停止，半提交的全局安装树会被自动检测并从安装前快照修复；主 registry 不可达时自动回退镜像。"
  en: "Version management for the dsh Web GUI settings panel: compare the installed @deepseek-ai/dsh against every npm channel or version line, install or downgrade in one click, roll back instantly from local snapshots, and automate the whole cycle with a policy engine (silent auto-update, execution windows, daily checks). Never stops npm mid-install — a wedged run is only stopped after an hour, and a half-committed global tree is detected and repaired from the pre-install snapshot automatically. Falls back to a mirror when the primary registry is unreachable."